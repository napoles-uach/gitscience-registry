  name: José Manuel Nápoles Duarte
summary: Formalize the abstract induction that accumulates declared local error bounds over a finite number
  of approximation steps.
formal_statement:
  language: lean4
  theorem_name: local_error_bounds_accumulate
  declaration: "theorem local_error_bounds_accumulate\n    {Error : Type}\n    (budget : ErrorBudget Error)\n\
    \    (cumulative stepError : Nat -> Error)\n    (initial : budget.le (cumulative 0) budget.zero)\n\
    \    (step : forall n,\n      budget.le (cumulative (n + 1))\n        (budget.add (cumulative n) (stepError\
    \ n))) :\n    forall steps,\n      budget.le (cumulative steps) (accumulatedError budget stepError\
    \ steps)"
  sha256: 46e7a641e1fe3192dd890cd593fa29041199911137109a781621259ab608b128
semantic_mapping:
- source: A local error bound holds at every approximation step.
  target: step
  status: partial
- source: Local error bounds accumulate over all steps.
  target: local_error_bounds_accumulate
  status: exact
assumptions:
- The declared error relation is transitive.
- Ordered addition is monotone in its first argument.
unformalized:
- The analytic local quantum-FMM error bound.
- The occupancy-tail estimate used by the numerical diagnostic.
- Applicability to generic interacting fermionic states.
scientific_grounding:
