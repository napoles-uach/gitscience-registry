kind: corollary
study: quantum-fmm
role: supporting_result
title: Conditional quantum-FMM error bound from occupancy tails
question: What final error bound follows from the local approximation and occupancy-tail premises?
plain_language_conclusion: The final error is bounded by accumulated good-subspace errors and ideal-state
  occupancy tails.
scope_summary: The result is general in form but conditional on every cited premise.
remaining_uncertainty: It does not infer all intermediate occupancy tails from the initial state.
statement:
  natural_language: 'Combining the restricted local error, hybrid accumulation, and RDM tail

    estimate bounds the final state error by good-subspace errors plus local

    occupancy tails of the ideal intermediate states.

    '
  latex: "\\|\\Psi_R-\\widetilde\\Psi_R\\|\\le\n\\sum_{k=1}^{R}\\left[\n  \\varepsilon_{g,k}+2\\sqrt{\n\
    \  \\frac{1}{(c+1)!}\\sum_b\\int_{b^{c+1}}\\rho_{c+1}^{(k)}}\n\\right].\n"
topic: QF
model: quantum-fmm-occupancy-v1
scope: general
depends_on:
- GS-QF-0002
- GS-QF-0003
- GS-QF-0004
limitations:
- The bound requires occupancy information at every ideal pre-call state.
- It does not yet certify the simulation from initial-state data alone.
