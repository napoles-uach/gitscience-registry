kind: lemma
study: quantum-fmm
role: supporting_result
title: Local hybrid error bounds accumulate additively
question: How do declared local replacement errors combine across repeated calls?
plain_language_conclusion: Lean proves that the cumulative error is at most the sum of supplied local
  bounds.
scope_summary: This is a general abstract induction over declared local error premises.
remaining_uncertainty: The proof does not derive the physical or analytic value of each local bound.
statement:
  natural_language: 'If the kth hybrid replacement has error at most e_k, repeated replacement

    of R calls has cumulative error at most the sum of the local bounds.

    '
  latex: '\forall k:\ d_{k+1}\le d_k+e_k,\quad d_0=0

    \quad\Longrightarrow\quad

    d_R\le\sum_{k=1}^{R}e_k.

    '
