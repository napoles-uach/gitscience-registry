  natural_language: 'Seek a bound on bad-box probability throughout kinetic evolution using

    initial occupancy, kinetic energy, time, capacity, and box scale.

    '
  latex: 'p_{\rm bad}(t)\le

    F\!\left(p_{\rm bad}(0),\langle T\rangle,t,c,h\right).

    '
