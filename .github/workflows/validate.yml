name: Validate scientific registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GitScience
        run: >-
          python -m pip install
          git+https://github.com/napoles-uach/gitscience.git@fe3c1525c086ef1d1005b5df2cd3148cbd58d747
      - name: Audit committed evidence
        run: |
          gitscience -C studies/twisted-ribbon audit
          gitscience -C studies/quantum-fmm audit
      - name: Compile and validate the public registry
        run: |
          gitscience registry build --from registry.yaml --output /tmp/registry.json
          python scripts/validate_registry.py /tmp/registry.json
